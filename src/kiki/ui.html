<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kiki, the kitchen grocery assistant: what it heard, what it did and the list.">
<title>Kiki</title>
<style>
  /* Look: DESIGN.md (Framer tokens + Kiki overrides). Colors only here, nowhere else. */
  :root {
    color-scheme: dark;
    --primary: #ffffff;
    --on-primary: #000000;
    --accent-blue: #0099ff;
    --ink: #ffffff;
    --ink-muted: #999999;
    --canvas: #090909;
    --surface-1: #141414;
    --surface-2: #1c1c1c;
    --hairline: #262626;
    --hairline-soft: #1a1a1a;
    --gradient-violet: #6a4cf5;
    --gradient-magenta: #d44df0;
    --semantic-success: #22c55e;
    --semantic-error: #ff5c5c;
    --rounded-sm: 6px;
    --rounded-md: 10px;
    --rounded-lg: 15px;
    --rounded-xl: 20px;
    --rounded-pill: 100px;
    --rounded-full: 9999px;
    --font: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --column: 640px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100dvh;
    background: var(--canvas); color: var(--ink);
    font: 400 15px/1.3 var(--font); letter-spacing: -0.15px;
    font-feature-settings: "cv01", "cv05", "cv09", "cv11", "ss03", "ss07";
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  /* Top bar (top-nav) */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 56px; padding: 0 30px;
  }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.8px; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px;
    font-size: 13px; font-weight: 500; letter-spacing: -0.13px; color: var(--ink-muted);
  }
  .status::before {
    content: ""; width: 7px; height: 7px; border-radius: var(--rounded-full);
    background: var(--ink-muted); transition: background-color .3s;
  }
  .status[data-live="yes"]::before { background: var(--semantic-success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--semantic-success) 20%, transparent); }
  .status[data-live="no"] { color: var(--semantic-error); }
  .status[data-live="no"]::before { background: var(--semantic-error); }

  /* Buttons: white pill, charcoal pill, circular icon */
  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 10px 15px; border: 0; border-radius: var(--rounded-pill);
    font: 500 14px/1 var(--font); letter-spacing: -0.14px; cursor: pointer;
    transition: background-color .2s, transform .2s var(--ease-out);
  }
  .button:active { transform: scale(.97); }
  .button.primary { background: var(--primary); color: var(--on-primary); }
  .button.primary:hover { background: color-mix(in srgb, var(--primary) 86%, var(--canvas)); }
  .button.secondary { background: var(--surface-1); color: var(--ink); }
  .button.secondary:hover { background: var(--surface-2); }
  .button .muted { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .button.icon { width: 40px; padding: 0; border-radius: var(--rounded-full); background: var(--surface-2); }
  .button.icon:hover { background: var(--hairline); }

  /* One centered column: orb, state, last run, list; the composer docks at the bottom. */
  main {
    width: 100%; max-width: calc(var(--column) + 40px); margin: 0 auto; padding: 0 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* The orb: as big as the screen allows; its canvas has a wide halo, so it overlaps its neighbors. */
  speaking-orb {
    --w: clamp(240px, 40dvh, 420px);
    width: var(--w); margin: calc(var(--w) * -0.14) 0 4px;
    --cap-size: 20px !important; /* the component sizes captions from its width; keep them body-lg */
    --orb-listening: var(--primary);
    --orb-thinking: var(--gradient-violet);
    --orb-searching: var(--accent-blue);
    --orb-speaking: var(--gradient-magenta);
    --orb-done: var(--semantic-success);
    --cap: var(--ink);
    --cap-font: var(--font);
    transition: opacity .6s, filter .6s, transform .8s var(--ease-out);
  }
  /* Idle rests small and dim; "hey jarvis" wakes it: it grows, brightens and ripples. */
  body[data-state="idle"] speaking-orb { opacity: .5; transform: scale(.84); }
  body[data-state="error"] speaking-orb { opacity: .4; filter: grayscale(1); transform: scale(.84); }

  .state {
    margin: 0; font-size: 32px; font-weight: 500; line-height: 1.13; letter-spacing: -1px;
    text-align: center; transition: color .3s;
  }
  body[data-state="error"] .state { color: var(--semantic-error); }

  /* What happened last: one quiet line under the state, opens History. */
  .last {
    min-height: 40px; margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px;
    text-align: center; color: var(--ink-muted); font-size: 14px; letter-spacing: -0.14px;
  }
  button.last {
    border: 0; background: none; padding: 6px 12px; border-radius: var(--rounded-md); cursor: pointer;
    transition: background-color .2s;
  }
  button.last:hover { background: var(--surface-1); }
  .last .heard { color: var(--ink); }
  button.last:hover .chip { --chip: var(--surface-2); }
  .suggestions .button { min-height: 34px; padding: 8px 14px; font-size: 13px; }

  /* The list (product-mockup-tile) */
  .list {
    width: 100%; margin-top: 30px; padding: 20px 20px 10px;
    background: var(--surface-1); border-radius: var(--rounded-xl);
  }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 0 10px; }
  .list-head .count { margin-right: auto; } /* the count beside the heading, Reset on the right */
  .list-head .button { min-height: 32px; padding: 6px 14px; font-size: 13px; background: var(--surface-2); }
  .list-head .button:hover { background: var(--hairline); }
  .list h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.8px; }
  .count { color: var(--ink-muted); font-size: 13px; font-weight: 500; letter-spacing: -0.13px; font-variant-numeric: tabular-nums; }
  ul.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
  @media (max-width: 520px) { ul.items { grid-template-columns: minmax(0, 1fr); } }
  ul.items li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 10px; margin: 0 -10px; border-radius: var(--rounded-md);
    box-shadow: inset 0 -1px 0 var(--hairline-soft);
    transition: background-color 1.2s, box-shadow 1.2s;
  }
  ul.items li.changed { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent-blue); transition: none; }
  ul.items li:has(.flip) { padding: 0; }
  .flip {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 12px 10px; border: 0; border-radius: var(--rounded-md); background: none;
    color: inherit; font: inherit; letter-spacing: inherit; text-align: left; cursor: pointer;
  }
  .flip:hover { background: var(--surface-2); }
  ul.items li.off { opacity: .45; }
  ul.items.enter li { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i) * 35ms); }
  .name { display: inline-block; }
  .what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .product { color: var(--ink-muted); font-size: 12px; letter-spacing: -0.12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name::first-letter { text-transform: uppercase; }
  .qty { color: var(--ink-muted); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .end { display: flex; align-items: center; gap: 10px; flex: none; }
  /* F or O: Frequent or Occasional, one quiet letter (FR-0.41) */
  .pattern {
    display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--rounded-full);
    background: var(--surface-2); color: var(--ink-muted); font-size: 11px; font-weight: 600;
  }
  ul.items li.more { grid-column: 1 / -1; padding: 0; box-shadow: none; }
  .more button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 14px 10px 6px; border: 0; background: none;
    color: var(--ink-muted); font: inherit; font-size: 13px; text-align: left; cursor: pointer; border-radius: var(--rounded-md);
  }
  .more button:hover { color: var(--ink); }
  .more svg { transition: transform .2s var(--ease-out); }
  .more button[aria-expanded="true"] svg { transform: rotate(180deg); }
  ul.items li.empty {
    grid-column: 1 / -1; flex-direction: column; gap: 6px; padding: 40px 0; margin: 0;
    text-align: center; box-shadow: none;
  }
  .empty small { color: var(--ink-muted); font-size: 13px; }

  /* Composer: docks to the bottom of the window, over a fade into the canvas. */
  .dock {
    position: sticky; bottom: 0; width: 100%; margin-top: 30px; padding: 30px 0 20px;
    background: linear-gradient(to top, var(--canvas) 65%, transparent);
  }
  .composer {
    display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 6px;
    background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--rounded-pill);
    transition: border-color .2s;
  }
  .composer:focus-within { border-color: var(--accent-blue); }
  .composer input {
    flex: 1; min-width: 0; padding: 10px 14px; border: 0; background: transparent;
    color: var(--ink); font: inherit; outline: none;
  }
  .composer input::placeholder { color: var(--ink-muted); }
  .hint { margin: 10px 0 0; text-align: center; color: var(--ink-muted); font-size: 12px; letter-spacing: -0.12px; }
  .form-error { margin: 10px 0 0; text-align: center; color: var(--semantic-error); font-size: 13px; }
  .form-error:empty { display: none; }

  /* Chips and run cards (template-card) */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--chip, var(--surface-1)); color: var(--ink); border-radius: var(--rounded-sm); padding: 3px 8px;
    font-size: 13px; font-weight: 500; letter-spacing: -0.13px; transition: background-color .2s;
  }
  .chip.bad { color: var(--semantic-error); }
  .run { background: var(--surface-2); border-radius: var(--rounded-lg); padding: 15px; --chip: var(--surface-1); }
  .meta {
    display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px;
    color: var(--ink-muted); font-size: 12px; letter-spacing: -0.12px; font-variant-numeric: tabular-nums;
  }
  .line { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: baseline; gap: 8px; margin: 6px 0 0; }
  .line b { color: var(--ink-muted); font-weight: 500; font-size: 13px; letter-spacing: -0.13px; }
  .run .error { color: var(--semantic-error); font-size: 13px; margin-top: 8px; }
  .products { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; letter-spacing: -0.13px; min-width: 0; }
  .products li { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .products .item { flex: none; color: var(--ink); }
  .products .item::first-letter { text-transform: uppercase; }
  .products .of { color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .products .note { flex: none; color: var(--ink-muted); background: var(--surface-1); border-radius: var(--rounded-sm); padding: 0 6px; }
  .products li.bad .of { color: var(--semantic-error); }
  .products li.wrap .of { white-space: normal; } /* the Items still without a Product: every name matters */
  details { margin-top: 12px; font-size: 13px; color: var(--ink-muted); }
  summary {
    display: inline-block; cursor: pointer; list-style: none; color: var(--ink);
    background: var(--hairline); border-radius: var(--rounded-pill); padding: 5px 12px; font-weight: 500;
  }
  summary::-webkit-details-marker { display: none; }
  details[open] summary { margin-bottom: 8px; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: var(--canvas); color: var(--ink-muted);
    padding: 10px; border-radius: var(--rounded-md); margin: 8px 0 0; font-size: 12px;
  }

  /* History sheet */
  dialog {
    position: fixed; inset: 0 0 0 auto; margin: 0; padding: 0; border: 0;
    width: min(460px, 100vw); max-width: none; height: 100dvh; max-height: none;
    background: var(--surface-1); color: var(--ink);
    border-radius: var(--rounded-xl) 0 0 var(--rounded-xl);
    flex-direction: column;
  }
  dialog[open] { display: flex; animation: sheet-in .4s var(--ease-out); }
  dialog::backdrop { background: color-mix(in srgb, var(--canvas) 70%, transparent); backdrop-filter: blur(6px); animation: fade-in .3s; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 15px; }
  .sheet-head h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.8px; }
  ol.runs {
    list-style: none; margin: 0; padding: 0 20px 20px; flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  ol.runs .empty { color: var(--ink-muted); padding: 20px 0; text-align: center; }

  /* Entry: the column rises in, one piece after another. */
  main > * { animation: rise .7s var(--ease-out) both; }
  main > :nth-child(2) { animation-delay: .06s; }
  main > :nth-child(3) { animation-delay: .12s; }
  main > :nth-child(4) { animation-delay: .18s; }
  main > :nth-child(5) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes sheet-in { from { transform: translateX(100%); } }
  @keyframes fade-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, ::backdrop { animation: none !important; }
    speaking-orb { transition: none; }
  }
</style>
</head>
<body data-state="idle">
<header class="top">
  <h1>Kiki</h1>
  <div class="top-actions">
    <span class="status" id="connection" role="status">connecting…</span>
    <button class="button secondary" id="history-open" type="button" aria-haspopup="dialog">History <span class="muted" id="run-count"></span></button>
  </div>
</header>

<main>
  <speaking-orb id="orb" state="listening" level="0" rest="listening"></speaking-orb>
  <p class="state" id="state" aria-live="polite">Idle</p>
  <div class="last" id="last"></div>

  <section class="list" aria-labelledby="list-heading">
    <div class="list-head">
      <h2 id="list-heading">Grocery list</h2>
      <span class="count" id="count"></span>
      <button class="button secondary" id="reset" type="button" title="Frequent items back at their usual quantity, occasional ones off">Reset</button>
    </div>
    <ul class="items enter" id="items"></ul>
  </section>

  <div class="dock">
    <form class="composer" id="command-form">
      <input id="command" type="text" maxlength="200" placeholder="Type a command" autocomplete="off" aria-label="Command">
      <button class="button primary" type="submit">Send</button>
    </form>
    <p class="form-error" id="form-error" role="alert"></p>
    <p class="hint">Or say “hey jarvis”, then the command.</p>
  </div>
</main>

<dialog id="history" aria-labelledby="history-heading">
  <div class="sheet-head">
    <h2 id="history-heading">Runs</h2>
    <button class="button icon" id="history-close" type="button" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ol class="runs" id="runs"></ol>
</dialog>

<script src="/speaking-orb.js"></script>
<script>
  const STATE_LABELS = { idle: "Idle", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking", error: "Something went wrong" };
  // Kiki's state -> the Speaking Orb's shape and liveliness (0 to 1).
  const ORB_SHAPES = { idle: ["listening", 0], listening: ["listening", 1], thinking: ["thinking", 0.5], speaking: ["speaking", 0.5], error: ["listening", 0] };
  const SUGGESTIONS = ["add bread and two milks", "make it three milks", "what's on the list"];
  const DONE_MS = 1800;
  const MAX_RUNS = 50;
  const $ = (id) => document.getElementById(id);
  const orb = $("orb");
  const sheet = $("history");
  let shownItems = new Map(); // name -> quantity, to highlight what changed
  let turnJustFinished = false;
  let doneTimer;

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value; else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child); // strings become text nodes, never HTML
    return node;
  }

  function showState(value) {
    clearTimeout(doneTimer);
    const [shape, level] = ORB_SHAPES[value] || ORB_SHAPES.idle;
    document.body.dataset.state = value;
    $("state").textContent = STATE_LABELS[value] || value;
    orb.setAttribute("level", level);
    if (value === "idle" && turnJustFinished) {
      orb.state = "done"; // a check mark, then back to rest
      doneTimer = setTimeout(() => { orb.state = shape; }, DONE_MS);
    } else {
      orb.state = shape;
    }
    turnJustFinished = false;
  }

  function caption(text) {
    // Captions only: passing word timings keeps the orb from speaking with the browser's voice.
    const words = text.split(/\s+/).filter(Boolean);
    if (words.length) orb.say(text, { words: orb.estimate(words, 0) });
  }

  // Every item Kiki knows (FR-0.41): the List, then a closed "Not on the list" part with the rest.
  let othersOpen = false;
  let lastItems = [];

  function patternMark(item) {
    const frequent = item.buying_pattern === "frequent";
    return el("span", { class: "pattern", title: frequent ? "Frequent" : "Occasional", "aria-label": frequent ? "Frequent" : "Occasional" }, frequent ? "F" : "O");
  }

  function showList(all, highlight) {
    lastItems = all;
    const items = all.filter((item) => item.on_list !== false);
    const others = all.filter((item) => item.on_list === false);
    const list = $("items");
    list.replaceChildren();
    const needed = items.filter((item) => item.status === "needed").length;
    $("count").textContent = items.length ? `${needed} item${needed === 1 ? "" : "s"}` : "";
    if (!items.length) {
      list.append(el("li", { class: "empty" }, "Nothing on the list yet.", el("small", {}, "Say “hey jarvis, add milk”.")));
    }
    const next = new Map();
    const shown = othersOpen ? [...items, ...others] : items;
    shown.forEach((item, i) => {
      if (i === items.length) list.append(moreRow(others.length));
      const key = item.name.toLowerCase();
      const off = item.status !== "needed";
      next.set(key, `${item.quantity} ${item.status}`);
      const product = item.product_name ? ` · ${item.product_name}` : "";
      const button = el("button", { type: "button", class: "flip", title: (off ? "Mark needed" : "Mark not needed") + product },
        el("span", { class: "what" }, el("span", { class: "name" }, item.name),
          ...(item.product_name ? [el("span", { class: "product" }, item.product_name)] : [])),
        el("span", { class: "end" },
          el("span", { class: "qty" }, item.on_list === false ? "" : off ? "Not needed" : item.quantity > 1 ? `× ${item.quantity}` : ""),
          patternMark(item)));
      button.addEventListener("click", () => setNeeded(item.name, off));
      const row = el("li", { style: `--i: ${i}`, class: off ? "off" : "" }, button);
      if (highlight && shownItems.get(key) !== next.get(key)) {
        row.classList.add("changed");
        setTimeout(() => row.classList.remove("changed"), 1500);
      }
      list.append(row);
    });
    if (!othersOpen && others.length) list.append(moreRow(others.length));
    if (highlight) list.classList.remove("enter"); // only the first paint cascades in
    shownItems = next;
  }

  function moreRow(count) {
    const chevron = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [k, v] of Object.entries({ width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" })) chevron.setAttribute(k, v);
    chevron.innerHTML = '<path d="M2.5 4.5l3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
    const button = el("button", { type: "button", "aria-expanded": String(othersOpen) }, `Not on the list · ${count}`, chevron);
    button.addEventListener("click", () => { othersOpen = !othersOpen; showList(lastItems, false); });
    return el("li", { class: "more" }, button);
  }

  function names(list) { return list.map((i) => (typeof i === "string" ? i : i.name)).join(", "); }

  function chip(call) {
    const { name, args, result } = call;
    if (result && result.error) return el("span", { class: "chip bad" }, `${name}: ${result.error}`);
    switch (name) {
      case "add_items": {
        const parts = [];
        if (result.added.length) parts.push("added " + result.added.map((i) => (i.quantity > 1 ? `${i.name} ×${i.quantity}` : i.name)).join(", "));
        if (result.already_present.length) parts.push("already there: " + names(result.already_present));
        return el("span", { class: "chip" }, parts.join(" · ") || "added nothing");
      }
      case "remove_items": {
        const parts = [];
        if (result.removed.length) parts.push("not needed: " + names(result.removed));
        if (result.not_found.length) parts.push("not on list: " + names(result.not_found));
        return el("span", { class: "chip" }, parts.join(" · "));
      }
      case "set_quantity":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name} → ${args.quantity}`);
      case "set_usual_quantity":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name} usually ${args.quantity}`);
      case "set_buying_pattern":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name} → ${args.buying_pattern}`);
      case "rename_item":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name} → ${args.new_name}`);
      case "clear_list": // the name before v0.17, still in older logs
      case "clear_all_items":
        return el("span", { class: "chip" }, `cleared ${result.removed.length} item${result.removed.length === 1 ? "" : "s"}`);
      case "reset_list":
        return el("span", { class: "chip" }, `reset: ${result.needed.length} needed`);
      case "set_product_for_item":
        if (result.failed) return el("span", { class: "chip bad" }, `Instacart: ${result.failed}`);
        if (result.not_found) return el("span", { class: "chip" }, `not on list: ${result.not_found}`);
        if (result.no_results) return el("span", { class: "chip bad" }, `no results: ${result.no_results}`);
        return el("span", { class: "chip" }, `${args.name} → ${result.product_name}`);
      case "forget_product_for_item":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name}: product forgotten`);
      // Ordering: a few summary chips; each item's Product is in the run card's Products row.
      case "learn_product_preferences": {
        if (result.failed) return el("span", { class: "chip bad" }, `Instacart: ${result.failed}`);
        const out = [el("span", { class: "chip" }, result.new_orders ? `read ${count(result.new_orders, "new order")}` : "no new orders")];
        if (result.matched.length) out.push(el("span", { class: "chip" }, `matched ${result.matched.length}`));
        if (result.no_product.length) out.push(el("span", { class: "chip" }, `${result.no_product.length} without a product`));
        if (result.unreadable_orders.length) out.push(el("span", { class: "chip bad" }, `${count(result.unreadable_orders.length, "order")} unreadable`));
        return out;
      }
      case "fill_cart": {
        if (result.failed) return el("span", { class: "chip bad" }, `Instacart: ${result.failed}`);
        const lines = result.lines || [];
        if (!lines.length) return el("span", { class: "chip" }, "nothing needed");
        const guessed = lines.filter((l) => l.status === "top_match").length;
        const failed = lines.filter((l) => l.status === "failed").length;
        const out = [el("span", { class: "chip" }, `cart: ${lines.length - failed} of ${lines.length}`)];
        if (guessed) out.push(el("span", { class: "chip" }, count(guessed, "top match")));
        if (failed) out.push(el("span", { class: "chip bad" }, `${failed} failed`));
        if (result.matching_failed) out.push(el("span", { class: "chip bad" }, "couldn't check past orders"));
        return out;
      }
      default:
        return el("span", { class: "chip" }, name);
    }
  }

  function count(n, word) { return `${n} ${word}${n === 1 ? "" : word.endsWith("ch") ? "es" : "s"}`; }

  const WHY = { sold_out: "sold out", not_found: "not found", unavailable: "unavailable", not_added: "didn't go in", more_than_nine: "more than nine" };

  // What ordering did per item: Products matched, guesses and failures, for the run card.
  function productRows(turn) {
    const rows = [];
    for (const { name, result } of turn.tool_calls) {
      if (!result || result.failed) continue;
      if (name !== "learn_product_preferences" && name !== "fill_cart") continue;
      (result.matched || []).forEach((m) => rows.push({ item: m.name, of: m.product_name }));
      (result.lines || []).forEach((l) => {
        if (l.status === "top_match") rows.push({ item: l.item, of: l.product_name, note: "top match" });
        if (l.status === "failed") rows.push({ item: l.item, of: WHY[l.reason] || l.reason, bad: true });
      });
      if ((result.no_product || []).length && name === "learn_product_preferences") rows.push({ item: "No product", of: names(result.no_product), wrap: true });
      (result.unreadable_orders || []).forEach((o) => rows.push({ item: `Order ${o.order_id}`, of: o.why, bad: true }));
    }
    return rows;
  }

  function chips(turn) {
    return turn.tool_calls.length ? turn.tool_calls.flatMap(chip) : [el("span", { class: "chip" }, "no change")];
  }

  function seconds(ms) { return ms == null ? "–" : `${(ms / 1000).toFixed(1)} s`; }

  function runCard(turn) {
    const time = new Date(turn.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const lat = turn.latency_ms;
    const card = el("li", { class: "run" },
      el("div", { class: "meta" }, el("span", {}, `${time} · ${turn.source}`), el("span", {}, seconds(lat.total))),
      el("div", { class: "line" }, el("b", {}, "Heard"), el("span", {}, turn.heard)),
      el("div", { class: "line" }, el("b", {}, "Did"), el("span", { class: "chips" }, ...chips(turn))),
      el("div", { class: "line" }, el("b", {}, "Said"), el("span", {}, turn.said)),
    );
    const rows = productRows(turn);
    if (rows.length) {
      card.insertBefore(el("div", { class: "line" }, el("b", {}, "Products"),
        el("ul", { class: "products" }, ...rows.map((r) => el("li", { class: [r.bad && "bad", r.wrap && "wrap"].filter(Boolean).join(" ") },
          el("span", { class: "item" }, r.item), el("span", { class: "of" }, r.of),
          ...(r.note ? [el("span", { class: "note" }, r.note)] : []))))), card.lastChild);
    }
    if (turn.error) card.append(el("div", { class: "error" }, turn.error));
    card.append(el("details", {},
      el("summary", {}, "Details"),
      el("div", {}, `speech-to-text ${seconds(lat.stt)} · model ${seconds(lat.llm)} · speech ${seconds(lat.tts)} · ${turn.model}`),
      el("pre", {}, JSON.stringify(turn.tool_calls, null, 2)),
    ));
    return card;
  }

  function showLast(turn) {
    let node;
    if (turn) {
      const extra = turn.error ? [el("span", { class: "chip bad" }, "error")] : [];
      node = el("button", { class: "last", type: "button", title: "Open history" },
        el("span", { class: "heard" }, `“${turn.heard}”`), ...chips(turn), ...extra);
      node.addEventListener("click", () => sheet.showModal());
    } else {
      node = el("div", { class: "last suggestions" }, ...SUGGESTIONS.map((text) => {
        const button = el("button", { class: "button secondary", type: "button" }, text);
        button.addEventListener("click", () => { $("command").value = text; $("command").focus(); });
        return button;
      }));
    }
    node.id = "last";
    $("last").replaceWith(node);
  }

  function addRun(turn) {
    const runs = $("runs");
    runs.querySelector(".empty")?.remove();
    runs.prepend(runCard(turn));
    while (runs.children.length > MAX_RUNS) runs.lastChild.remove();
    $("run-count").textContent = runs.children.length;
    showLast(turn);
  }

  function clearRuns() {
    $("runs").replaceChildren(el("li", { class: "empty" }, "No runs yet."));
    $("run-count").textContent = "";
    showLast(null);
  }

  function connect() {
    const source = new EventSource("/events");
    const status = (text, live) => { $("connection").textContent = text; $("connection").dataset.live = live; };
    source.onopen = () => status("live", "yes");
    source.onerror = () => status("reconnecting…", "no");
    source.onmessage = (message) => {
      const event = JSON.parse(message.data);
      if (event.type === "snapshot") {
        showState(event.state);
        showList(event.items, false);
        clearRuns();
        event.turns.forEach(addRun);
      } else if (event.type === "state") {
        showState(event.value);
      } else if (event.type === "list") {
        showList(event.items, true);
      } else if (event.type === "progress") {
        $("state").textContent = event.text; // "Filling cart, 4 of 12" while the orb thinks
      } else if (event.type === "turn") {
        addRun(event);
        turnJustFinished = !event.error;
        if (event.said) caption(event.said);
      }
    };
  }

  $("command-form").addEventListener("submit", async (submit) => {
    submit.preventDefault();
    const input = $("command");
    const text = input.value.trim();
    if (!text) return;
    $("form-error").textContent = "";
    try {
      const response = await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      input.value = "";
    } catch (error) {
      $("form-error").textContent = `Couldn't send that (${error.message}).`;
    }
  });

  async function setNeeded(name, needed) {
    $("form-error").textContent = "";
    try {
      const response = await fetch("/item", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, needed }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (error) {
      $("form-error").textContent = `Couldn't change ${name} (${error.message}).`;
    }
  }

  // Reset takes two taps, so a stray one can't start the List over (FR-0.35).
  let resetArmed;
  $("reset").addEventListener("click", async () => {
    const button = $("reset");
    if (!resetArmed) {
      button.textContent = "Tap again to reset";
      resetArmed = setTimeout(() => { resetArmed = null; button.textContent = "Reset"; }, 3000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    button.textContent = "Reset";
    try {
      const response = await fetch("/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
    } catch (error) {
      $("form-error").textContent = `Couldn't reset the list (${error.message}).`;
    }
  });

  $("history-open").addEventListener("click", () => sheet.showModal());
  $("history-close").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", (click) => { if (click.target === sheet) sheet.close(); });

  connect();
</script>
</body>
</html>
