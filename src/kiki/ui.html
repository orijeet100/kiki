<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiki</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #1d1b18;
    --muted: #6f6a62;
    --line: #e6e1d7;
    --accent: #d9622b;
    --chip: #f1ece3;
    --ok: #2f7d4f;
    --warn: #b3261e;
    --flash: #fff1c2;
    --orb-a: #ff9a5a;
    --orb-b: #f2c14e;
    --orb-c: #e0567a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --panel: #1e1c19;
      --ink: #f2eee7;
      --muted: #a39d93;
      --line: #322e29;
      --accent: #ff8a4c;
      --chip: #2a2723;
      --ok: #6cc28f;
      --warn: #ff8a80;
      --flash: #4a3d17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  .pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: var(--chip); color: var(--muted);
  }
  .pill.offline { color: var(--warn); }
  main {
    display: grid; gap: 20px; padding: 20px;
    grid-template-columns: minmax(260px, 340px) minmax(240px, 1fr) minmax(300px, 1.4fr);
    max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; min-width: 0;
  }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  /* Orb */
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .orb {
    width: 200px; aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgb(255 255 255 / .55), transparent 38%),
      conic-gradient(from var(--spin), var(--orb-a), var(--orb-b), var(--orb-c), var(--orb-a));
    box-shadow: 0 0 40px -6px var(--orb-a);
    transition: filter .4s, box-shadow .4s;
  }
  .orb[data-state="idle"] { filter: saturate(.55) brightness(.92); animation: breathe 6s ease-in-out infinite, spin 30s linear infinite; }
  .orb[data-state="listening"] { box-shadow: 0 0 70px 4px var(--orb-a); animation: breathe 1.1s ease-in-out infinite, spin 8s linear infinite; }
  .orb[data-state="thinking"] { filter: saturate(.9); animation: spin 1.4s linear infinite; transform: scale(.92); }
  .orb[data-state="speaking"] { box-shadow: 0 0 60px 0 var(--orb-c); animation: talk .45s ease-in-out infinite alternate, spin 5s linear infinite; }
  .orb[data-state="error"] { --orb-a: #b3261e; --orb-b: #e57368; --orb-c: #7a1712; filter: saturate(.7); }
  @keyframes spin { to { --spin: 360deg; } }
  @keyframes breathe { 50% { transform: scale(.95); } }
  @keyframes talk { from { transform: scale(.97); } to { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none !important; } }
  .state { font-size: 20px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }

  form { display: flex; gap: 8px; width: 100%; margin-top: 6px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  button {
    padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .form-error { color: var(--warn); font-size: 13px; min-height: 1.2em; margin: 0; }

  /* List */
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 10px; border-radius: 8px; border-bottom: 1px solid var(--line);
    transition: background-color 1.2s;
  }
  ul.items li:last-child { border-bottom: 0; }
  ul.items li.changed { background: var(--flash); transition: none; }
  .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 8px 2px; }
  .count { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* Runs */
  ol.runs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.runs li { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .line { margin: 3px 0; display: grid; grid-template-columns: 52px 1fr; align-items: baseline; }
  .line b { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .chips { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
  .chip.bad { color: var(--warn); }
  .error { color: var(--warn); font-size: 13px; margin-top: 4px; }
  details { margin-top: 6px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 8px; border-radius: 6px; margin: 6px 0 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Kiki</h1>
  <span class="pill" id="connection" role="status">connecting…</span>
</header>
<main>
  <section aria-labelledby="assistant-heading">
    <h2 id="assistant-heading">Assistant</h2>
    <div class="stage">
      <div class="orb" id="orb" data-state="idle" aria-hidden="true"></div>
      <div class="state" id="state" aria-live="polite">Idle</div>
      <p class="hint">Say “hey jarvis”, then a command. Or type one:</p>
      <form id="command-form">
        <input id="command" type="text" maxlength="200" placeholder="add bread and two milks" autocomplete="off" aria-label="Command">
        <button type="submit">Send</button>
      </form>
      <p class="form-error" id="form-error" role="alert"></p>
    </div>
  </section>

  <section aria-labelledby="list-heading">
    <h2 id="list-heading">Grocery list <span class="count" id="count"></span></h2>
    <ul class="items" id="items"></ul>
  </section>

  <section aria-labelledby="runs-heading">
    <h2 id="runs-heading">Runs</h2>
    <ol class="runs" id="runs"></ol>
  </section>
</main>

<script>
  const STATE_LABELS = { idle: "Idle", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking", error: "Something went wrong" };
  const MAX_RUNS = 50;
  const $ = (id) => document.getElementById(id);
  let shownItems = new Map(); // name -> quantity, to highlight what changed

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value; else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child); // strings become text nodes, never HTML
    return node;
  }

  function showState(value) {
    $("orb").dataset.state = value;
    $("state").textContent = STATE_LABELS[value] || value;
  }

  function showList(items, highlight) {
    const list = $("items");
    list.replaceChildren();
    $("count").textContent = items.length ? `· ${items.length}` : "";
    if (!items.length) list.append(el("li", { class: "empty" }, "The list is empty."));
    const next = new Map();
    for (const item of items) {
      const key = item.name.toLowerCase();
      next.set(key, item.quantity);
      const row = el("li", {}, el("span", {}, item.name), el("span", { class: "qty" }, `× ${item.quantity}`));
      if (highlight && shownItems.get(key) !== item.quantity) {
        row.classList.add("changed");
        setTimeout(() => row.classList.remove("changed"), 1500);
      }
      list.append(row);
    }
    shownItems = next;
  }

  function names(list) { return list.map((i) => (typeof i === "string" ? i : i.name)).join(", "); }

  function chip(call) {
    const { name, args, result } = call;
    if (result && result.error) return el("span", { class: "chip bad" }, `${name}: ${result.error}`);
    switch (name) {
      case "add_items": {
        const parts = [];
        if (result.added.length) parts.push("added " + result.added.map((i) => (i.quantity > 1 ? `${i.name} ×${i.quantity}` : i.name)).join(", "));
        if (result.already_present.length) parts.push("already there: " + names(result.already_present));
        return el("span", { class: "chip" }, parts.join(" · ") || "added nothing");
      }
      case "remove_items": {
        const parts = [];
        if (result.removed.length) parts.push("removed " + names(result.removed));
        if (result.not_found.length) parts.push("not on list: " + names(result.not_found));
        return el("span", { class: "chip" }, parts.join(" · "));
      }
      case "set_quantity":
        return el("span", { class: "chip" }, result.not_found ? `not on list: ${result.not_found}` : `${args.name} → ${args.quantity}`);
      case "clear_list":
        return el("span", { class: "chip" }, `cleared ${result.removed.length} item${result.removed.length === 1 ? "" : "s"}`);
      default:
        return el("span", { class: "chip" }, name);
    }
  }

  function seconds(ms) { return ms == null ? "–" : `${(ms / 1000).toFixed(1)} s`; }

  function runCard(turn) {
    const time = new Date(turn.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const chips = turn.tool_calls.length ? turn.tool_calls.map(chip) : [el("span", { class: "chip" }, "no change")];
    const did = el("span", { class: "chips" }, ...chips);
    const lat = turn.latency_ms;
    const card = el("li", {},
      el("div", { class: "meta" }, el("span", {}, `${time} · ${turn.source}`), el("span", {}, seconds(lat.total))),
      el("div", { class: "line" }, el("b", {}, "Heard"), turn.heard),
      el("div", { class: "line" }, el("b", {}, "Did"), did),
      el("div", { class: "line" }, el("b", {}, "Said"), turn.said),
    );
    if (turn.error) card.append(el("div", { class: "error" }, turn.error));
    card.append(el("details", {},
      el("summary", {}, "Details"),
      el("div", {}, `speech-to-text ${seconds(lat.stt)} · model ${seconds(lat.llm)} · speech ${seconds(lat.tts)} · ${turn.model}`),
      el("pre", {}, JSON.stringify(turn.tool_calls, null, 2)),
    ));
    return card;
  }

  function addRun(turn) {
    const runs = $("runs");
    runs.prepend(runCard(turn));
    while (runs.children.length > MAX_RUNS) runs.lastChild.remove();
  }

  function connect() {
    const source = new EventSource("/events");
    source.onopen = () => { $("connection").textContent = "live"; $("connection").classList.remove("offline"); };
    source.onerror = () => { $("connection").textContent = "reconnecting…"; $("connection").classList.add("offline"); };
    source.onmessage = (message) => {
      const event = JSON.parse(message.data);
      if (event.type === "snapshot") {
        showState(event.state);
        showList(event.items, false);
        $("runs").replaceChildren();
        event.turns.forEach(addRun);
      } else if (event.type === "state") {
        showState(event.value);
      } else if (event.type === "list") {
        showList(event.items, true);
      } else if (event.type === "turn") {
        addRun(event);
      }
    };
  }

  $("command-form").addEventListener("submit", async (submit) => {
    submit.preventDefault();
    const input = $("command");
    const text = input.value.trim();
    if (!text) return;
    $("form-error").textContent = "";
    try {
      const response = await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      input.value = "";
    } catch (error) {
      $("form-error").textContent = `Couldn't send that (${error.message}).`;
    }
  });

  connect();
</script>
</body>
</html>
